# GoReleaser config: https://goreleaser.com
# Tag a commit (git tag v0.1.0 && git push origin v0.1.0) and the release
# workflow builds these archives and publishes a GitHub release.
version: 2

project_name: mailhook

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: mailhook
    main: ./cmd/mailhook
    binary: mailhook
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}
    # The background daemon uses Unix process APIs (setsid, kill), so
    # Windows is not built yet.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    # mailhook_0.1.0_darwin_arm64.tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - SKILL.md
      - docs/*.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

# Homebrew cask in PasinduYeshan/homebrew-tap:
#   brew install PasinduYeshan/tap/mailhook
# Needs the HOMEBREW_TAP_TOKEN secret (contents write on the tap repo);
# the workflow's own token cannot push to another repository.
homebrew_casks:
  - name: mailhook
    binaries:
      - mailhook
    homepage: "https://github.com/PasinduYeshan/mailhook"
    description: "Local mail and webhook catcher with a web inspector and mock responses"
    license: MIT
    directory: Casks
    repository:
      owner: PasinduYeshan
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    # Pre-releases (v0.2.0-rc.1) don't update the tap.
    skip_upload: auto
    # The binary is not signed by Apple; clear the download quarantine so
    # macOS lets it run.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/mailhook"]
          end

release:
  github:
    owner: PasinduYeshan
    name: mailhook
  # Tags like v0.2.0-rc.1 become pre-releases.
  prerelease: auto
  extra_files:
    - glob: ./scripts/install.sh
  footer: |
    ## Install

    ```bash
    curl -fsSL https://github.com/PasinduYeshan/mailhook/releases/latest/download/install.sh | sh
    ```

    Or download the archive for your platform below and check it against `checksums.txt`.
