<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mailhook</title>
<style>
:root {
  --bg: #0d1117; --bg-elev: #161b22; --bg-deep: #010409; --bg-hover: #1c2129;
  --border: #30363d; --border-soft: #21262d;
  --fg: #e6edf3; --fg-soft: #c9d1d9; --muted: #8b949e; --dim: #6e7681;
  --accent: #58a6ff; --accent-bg: rgba(56,139,253,0.14); --sel: rgba(56,139,253,0.16);
  --green: #3fb950; --green-bg: rgba(46,160,67,0.18);
  --yellow: #d29922; --yellow-bg: rgba(187,128,9,0.2);
  --red: #f85149; --red-bg: rgba(248,81,73,0.15);
  --purple: #bc8cff;
  --code-fg: #e3b341; --code-bg: rgba(227,179,65,0.12); --code-border: rgba(227,179,65,0.35);
  --bubble: #1f6feb; --bubble-fg: #fff;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #ffffff; --bg-elev: #f6f8fa; --bg-deep: #f6f8fa; --bg-hover: #f3f4f6;
    --border: #d0d7de; --border-soft: #e5e9ee;
    --fg: #1f2328; --fg-soft: #24292f; --muted: #59636e; --dim: #818b98;
    --accent: #0969da; --accent-bg: rgba(9,105,218,0.08); --sel: rgba(9,105,218,0.09);
    --green: #1a7f37; --green-bg: rgba(31,136,61,0.12);
    --yellow: #9a6700; --yellow-bg: rgba(154,103,0,0.12);
    --red: #cf222e; --red-bg: rgba(207,34,46,0.1);
    --purple: #8250df;
    --code-fg: #7d4e00; --code-bg: #fff8c5; --code-border: #e6c84f;
    --bubble: #0969da;
    color-scheme: light;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; }
code, pre, .mono { font-family: var(--mono); font-size: 14px; }
a { color: var(--accent); }
button, .btn { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-elev); color: var(--fg); padding: 4px 12px; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
button:hover, .btn:hover { background: var(--bg-hover); border-color: var(--dim); }
.btn-sm { font-size: 13px; padding: 1px 7px; border-radius: 5px; }
.btn-danger:hover { color: var(--red); border-color: var(--red); }
.btn-primary { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }

header { padding: 10px 18px; background: var(--bg-elev); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; flex-shrink: 0; flex-wrap: wrap; }
h1 { font-size: 16.5px; font-weight: 700; color: var(--accent); letter-spacing: 0.3px; }
.tabs { display: flex; gap: 2px; }
.tabs button { background: none; border: 1px solid transparent; color: var(--muted); padding: 5px 13px; font-weight: 500; }
.tabs button.active { background: var(--bg); border-color: var(--border); color: var(--fg); }
.tabs button:hover:not(.active) { color: var(--fg); background: none; }
.count { color: var(--accent); margin-left: 5px; font-size: 13px; font-variant-numeric: tabular-nums; }
.count.has-new::after { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: 4px; vertical-align: 1px; }
#search { flex: 1; min-width: 160px; max-width: 420px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--fg); padding: 4px 10px; font: inherit; }
#search:focus { outline: none; border-color: var(--accent); }
.controls { margin-left: auto; display: flex; gap: 8px; align-items: center; color: var(--muted); }
.controls label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
.controls input[type=checkbox] { accent-color: var(--green); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
.dot.live { background: var(--green); box-shadow: 0 0 6px var(--green); }

main { flex: 1; display: flex; min-height: 0; }
.list-panel { width: 40%; min-width: 360px; max-width: 640px; overflow-y: auto; border-right: 1px solid var(--border); }
.detail-panel { flex: 1; overflow-y: auto; min-width: 0; }
.detail-inner { padding: 18px 24px 28px; display: flex; flex-direction: column; gap: 14px; max-width: 1200px; }

.row { position: relative; padding: 8px 14px 9px 22px; border-bottom: 1px solid var(--border-soft); cursor: pointer; display: flex; flex-direction: column; gap: 1px; }
.row:hover { background: var(--bg-hover); }
.row.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
.row.unread::before { content: ''; position: absolute; left: 8px; top: 15px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.row .r1 { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.row .who { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.row.unread .who, .row.unread .subj { color: var(--fg); }
.row .time { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .subj { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg-soft); }
.row .snip { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .chips { display: flex; gap: 5px; margin-top: 3px; flex-wrap: wrap; }
.row .chips:empty { display: none; }
.row .x { position: absolute; right: 10px; bottom: 7px; opacity: 0; padding: 0 6px; font-size: 14px; background: var(--bg); }
.row:hover .x { opacity: 1; }
.row .path { font-family: var(--mono); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }

.group { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; background: var(--bg-elev); border-bottom: 1px solid var(--border-soft); cursor: pointer; user-select: none; }
.group:hover { background: var(--bg-hover); }
.group .tw { color: var(--dim); width: 12px; font-size: 11.5px; }
.group .gp { font-family: var(--mono); font-size: 14px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.group .ans { font-size: 13px; color: var(--muted); white-space: nowrap; }
.group .ans b { font-weight: 600; }
.group .ans .rule { color: var(--purple); }
.list-tools { display: flex; align-items: center; gap: 8px; padding: 5px 12px; border-bottom: 1px solid var(--border-soft); color: var(--muted); font-size: 13px; }
.list-tools label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.list-tools .grow { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 3px; font-size: 13px; line-height: 16px; padding: 0 6px; border-radius: 10px; border: 1px solid var(--border); color: var(--muted); background: var(--bg); }
.chip.code { font-family: var(--mono); color: var(--code-fg); background: var(--code-bg); border-color: var(--code-border); cursor: copy; font-weight: 600; }
.chip.code:hover { filter: brightness(1.15); }
.chip.warn { color: var(--yellow); background: var(--yellow-bg); border-color: transparent; }
.chip.err { color: var(--red); background: var(--red-bg); border-color: transparent; }
.chip.smsc { color: var(--purple); border-color: transparent; background: rgba(188,140,255,0.12); }

.method { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 12.5px; font-weight: 700; font-family: var(--mono); line-height: 17px; background: rgba(110,118,129,0.2); color: var(--muted); }
.method.GET { background: var(--accent-bg); color: var(--accent); }
.method.POST { background: var(--green-bg); color: var(--green); }
.method.PUT, .method.PATCH { background: var(--yellow-bg); color: var(--yellow); }
.method.DELETE { background: var(--red-bg); color: var(--red); }

.empty, .detail-empty { padding: 60px 24px; text-align: center; color: var(--dim); line-height: 1.8; }
.empty pre { display: inline-block; text-align: left; margin-top: 10px; padding: 10px 14px; background: var(--bg-deep); border: 1px solid var(--border-soft); border-radius: 6px; color: var(--muted); white-space: pre-wrap; word-break: break-all; }

.d-head { display: flex; gap: 12px; align-items: flex-start; }
.d-title { font-size: 20px; font-weight: 600; flex: 1; min-width: 0; word-break: break-word; line-height: 1.35; }
.d-title .path { font-family: var(--mono); font-size: 17.5px; }
.d-actions { display: flex; gap: 6px; flex-shrink: 0; }
.meta { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; font-size: 14.5px; }
.meta dt { color: var(--muted); }
.meta dd { word-break: break-word; min-width: 0; }
.meta .sub { color: var(--dim); }

.card { border: 1px solid var(--border); border-radius: 8px; background: var(--bg-elev); }
.card-h { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--border-soft); color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
.card-h .grow { flex: 1; }
.card-h button { text-transform: none; letter-spacing: 0; font-weight: 400; }
.card-b { padding: 10px 12px; }

.codes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.code-big { font-family: var(--mono); font-size: 25.5px; font-weight: 700; letter-spacing: 3px; color: var(--code-fg); background: var(--code-bg); border: 1px solid var(--code-border); border-radius: 8px; padding: 4px 14px; cursor: copy; }
.code-big:hover { filter: brightness(1.15); background: var(--code-bg); border-color: var(--code-fg); }
.code-big small { font-size: 11.5px; letter-spacing: 0.5px; font-weight: 500; opacity: 0.7; margin-left: 4px; font-family: -apple-system, sans-serif; }

.links { display: flex; flex-direction: column; }
.link { padding: 8px 12px; border-top: 1px solid var(--border-soft); }
.link:first-child { border-top: none; }
.link-top { display: flex; gap: 8px; align-items: center; }
.link-label { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link-label .host { font-weight: 400; color: var(--muted); margin-left: 6px; font-size: 14px; }
.link-btns { display: flex; gap: 5px; flex-shrink: 0; }
.link-url { font-family: var(--mono); font-size: 13.5px; word-break: break-all; margin-top: 3px; color: var(--muted); line-height: 1.45; }
.u-h { color: var(--fg); } .u-p { color: var(--fg-soft); } .u-k { color: var(--purple); } .u-v { color: var(--muted); } .u-a { color: var(--dim); }
.params { width: 100%; border-collapse: collapse; margin-top: 7px; font-size: 14px; }
.params td { padding: 3px 8px; border-top: 1px solid var(--border-soft); vertical-align: top; }
.params td:first-child { font-family: var(--mono); color: var(--purple); white-space: nowrap; width: 1%; }
.params td.v { font-family: var(--mono); word-break: break-all; }
.params td:last-child { width: 1%; text-align: right; }
.more { padding: 6px 12px; border-top: 1px solid var(--border-soft); }

.atts { display: flex; flex-wrap: wrap; gap: 8px; }
.att { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); max-width: 100%; }
.att .ico { width: 34px; height: 34px; border-radius: 4px; background: var(--bg-elev); display: grid; place-items: center; font-size: 11.5px; font-weight: 700; color: var(--muted); overflow: hidden; flex-shrink: 0; }
.att .ico img { width: 100%; height: 100%; object-fit: cover; }
.att .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
.att .sz { color: var(--dim); font-size: 13px; }

.vtabs { display: flex; gap: 2px; align-items: center; border-bottom: 1px solid var(--border); }
.vtabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: var(--muted); padding: 6px 12px; margin-bottom: -1px; }
.vtabs button.active { color: var(--fg); border-bottom-color: var(--accent); }
.vtabs button:hover:not(.active) { color: var(--fg); background: none; }
.vtabs .grow { flex: 1; }
.vtabs .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 4px; }
.vtabs .seg button { border: none; border-radius: 0; padding: 2px 9px; font-size: 13px; margin: 0; border-bottom: none; }
.vtabs .seg button.active { background: var(--accent-bg); color: var(--accent); }

.frame-wrap { background: #fff; border: 1px solid var(--border); border-radius: 6px; margin: 0 auto; width: 100%; overflow: hidden; transition: width .15s; }
.mail-frame { display: block; width: 100%; height: 300px; border: 0; background: #fff; }
.pre { padding: 12px 14px; background: var(--bg-deep); border: 1px solid var(--border-soft); border-radius: 6px; color: var(--fg-soft); overflow-x: auto; white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 14px; line-height: 1.55; }
.pre.prose { font-family: inherit; font-size: 16px; line-height: 1.6; }
.pre a { word-break: break-all; }
mark.code { background: var(--code-bg); color: var(--code-fg); border: 1px solid var(--code-border); border-radius: 4px; padding: 0 3px; font-weight: 700; cursor: copy; font-family: var(--mono); }
.j-k { color: var(--purple); } .j-s { color: var(--green); } .j-n { color: var(--accent); } .j-b { color: var(--yellow); }
.kv { width: 100%; border-collapse: collapse; font-size: 14px; }
.kv td { padding: 4px 10px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
.kv td:first-child { font-family: var(--mono); color: var(--muted); white-space: nowrap; width: 1%; }
.kv td.v { font-family: var(--mono); word-break: break-all; }
.kv td:last-child:not(.v) { width: 1%; }

.sms { display: flex; flex-direction: column; gap: 8px; padding: 12px; }
.sms-who { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.sms-who b { color: var(--fg); font-family: var(--mono); font-weight: 600; }
.bubble { align-self: flex-start; max-width: 520px; background: var(--bubble); color: var(--bubble-fg); padding: 9px 13px; border-radius: 16px 16px 16px 4px; white-space: pre-wrap; word-break: break-word; font-size: 16.5px; line-height: 1.45; }
.bubble a { color: inherit; text-decoration: underline; word-break: break-all; }
.bubble mark.code { background: rgba(255,255,255,0.22); color: inherit; border-color: rgba(255,255,255,0.45); }

footer { padding: 6px 16px; color: var(--dim); font-size: 13px; border-top: 1px solid var(--border-soft); flex-shrink: 0; display: flex; gap: 12px; flex-wrap: wrap; }
footer .grow { flex: 1; }
kbd { font-family: var(--mono); font-size: 11.5px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; color: var(--muted); }
#toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px); background: var(--fg); color: var(--bg); padding: 6px 14px; border-radius: 6px; font-size: 14px; opacity: 0; pointer-events: none; transition: all .18s; max-width: 80vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#toast.show { opacity: 1; transform: translateX(-50%); }

/* Rule form */
#rule-form { display: none; padding: 14px 16px; background: var(--bg-elev); border-bottom: 1px solid var(--border); }
#rule-form.open { display: block; }
#rule-form h2 { font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
#rule-form .grid { display: grid; grid-template-columns: 120px 1fr 100px 100px; gap: 8px; margin-bottom: 8px; }
#rule-form label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.3px; }
#rule-form input, #rule-form select, #rule-form textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--fg); padding: 5px 8px; font: 14px var(--mono); }
#rule-form input:focus, #rule-form select:focus, #rule-form textarea:focus { outline: none; border-color: var(--accent); }
#rule-form textarea { min-height: 60px; resize: vertical; }
#rule-form .frow { margin-bottom: 8px; }
#rule-form .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
.hint { color: var(--dim); font-size: 13px; margin-top: 3px; }

@media (max-width: 760px) {
  main { flex-direction: column; }
  .list-panel { width: 100%; max-width: none; min-width: 0; max-height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
  .detail-inner { padding: 14px; }
  #rule-form .grid { grid-template-columns: 1fr 1fr; }
}
.ports { display: flex; gap: 6px; flex-wrap: wrap; }
.port { background: var(--bg); border-color: var(--border); color: var(--muted); padding: 3px 10px; font-size: 13px; }
.port b { font-family: var(--mono); font-weight: 600; color: var(--fg); }
.port:hover b { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>mailhook</h1>
  <div class="ports">
    <button class="port" data-act="copy" data-v="{{SMTP_ADDR}}" title="SMTP server for apps under test (no TLS, no auth). Click to copy.">SMTP <b>{{SMTP_ADDR}}</b></button>
    <button class="port" data-act="copy" data-v="{{HOOK_URL}}/" title="Point SMS or webhook senders here, any path. Click to copy.">Hooks <b>{{HOOK_URL}}</b></button>
  </div>
  <div class="tabs">
    <button id="tab-mail" class="active">Mail<span class="count" id="cnt-mail">0</span></button>
    <button id="tab-hook">Hooks<span class="count" id="cnt-hook">0</span></button>
    <button id="tab-rule">Rules<span class="count" id="cnt-rule">0</span></button>
  </div>
  <input id="search" type="search" placeholder="Filter: recipient, subject, body, path…  ( / )" autocomplete="off" spellcheck="false">
  <div class="controls">
    <label id="livewrap" title="Stream new captures as they arrive"><span class="dot" id="livedot"></span><input type="checkbox" id="auto" checked> live</label>
    <button id="add-rule" class="btn-primary" hidden>+ add rule</button>
    <button id="refresh" title="Reload from server">refresh</button>
    <button id="clear" class="btn-danger" title="Delete everything in this tab">clear</button>
  </div>
</header>

<div id="rule-form">
  <h2 id="rule-form-title">New rule</h2>
  <div class="grid">
    <div>
      <label>Method</label>
      <select id="rf-method">
        <option value="*">* (any)</option>
        <option value="GET">GET</option>
        <option value="POST" selected>POST</option>
        <option value="PUT">PUT</option>
        <option value="PATCH">PATCH</option>
        <option value="DELETE">DELETE</option>
        <option value="HEAD">HEAD</option>
        <option value="OPTIONS">OPTIONS</option>
      </select>
    </div>
    <div>
      <label>Path</label>
      <input id="rf-path" type="text" placeholder="/sms/send  ·  /api/*  ·  *">
    </div>
    <div>
      <label>Status</label>
      <input id="rf-status" type="number" value="200" min="100" max="599">
    </div>
    <div>
      <label>Delay (ms)</label>
      <input id="rf-delay" type="number" value="0" min="0">
    </div>
  </div>
  <div class="frow">
    <label>Response headers (one per line, <code>Key: Value</code>)</label>
    <textarea id="rf-headers" placeholder="Content-Type: application/json&#10;X-Provider: mailhook"></textarea>
  </div>
  <div class="frow">
    <label>Response body</label>
    <textarea id="rf-body" placeholder='{"messageId":"abc","queued":true}'></textarea>
    <div class="hint">JSON-looking bodies auto-get <code>Content-Type: application/json</code> unless you set one above.</div>
  </div>
  <div class="form-actions">
    <button id="rf-cancel">cancel</button>
    <button id="rf-save" class="btn-primary">save</button>
  </div>
</div>

<main>
  <div class="list-panel" id="list-panel"><div id="list"></div></div>
  <div class="detail-panel" id="detail-panel"></div>
</main>
<footer>
  <span>SMTP {{SMTP}} · HOOK {{HOOK}} · API {{API}}</span>
  <span class="grow"></span>
  <span><kbd>↑</kbd><kbd>↓</kbd> move · <kbd>/</kbd> filter · <kbd>c</kbd> copy code · <kbd>o</kbd> open first link</span>
</footer>
<div id="toast"></div>

<script>
const CFG = { smtp: '{{SMTP}}', hook: '{{HOOK}}', hookURL: '{{HOOK_URL}}', cap: Number('{{CAP}}') || 500 };
const KINDS = ['mail', 'hook', 'rule'];
const state = {
  tab: 'mail',
  data: { mail: [], hook: [], rule: [] },
  sel: { mail: null, hook: null, rule: null },
  q: '',
  unread: new Set(),
  view: {},               // capture id -> body view tab
  width: 'full',          // email preview width
  openParams: new Set(),  // "id|url" with params expanded
  allLinks: new Set(),    // ids with all links shown
  group: lsGet('mh.group', '1') === '1', // group hooks by path
  collapsed: new Set(),   // collapsed hook paths
};
function lsGet(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
let editingRuleId = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- helpers ----------

function fmtTime(t) {
  const d = new Date(t), now = new Date();
  const hms = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

// Escape text, link URLs and mark known codes.
function richText(text, codes) {
  const urlRe = /\bhttps?:\/\/[^\s<>"'`]+/gi;

function searchText(kind, x) {

function filtered() {

// Items in display order (skips collapsed groups).
function visible() {

function current() {

// ---------- rules: mirror of the server's matchRule ----------

function ruleFor(method, path) {
  const rules = state.data.rule;
  for (let i = rules.length - 1; i >= 0; i--) {
    const r = rules[i];
    const mOK = !r.method || r.method === '*' || r.method.toUpperCase() === method.toUpperCase();
    let pOK = !r.path || r.path === '*' || r.path === path;
    if (!pOK && r.path.endsWith('/*')) { const pre = r.path.slice(0, -2); pOK = path === pre || path.startsWith(pre + '/'); }
    if (mOK && pOK) return r;
  }
  return null;
}

// Hooks grouped by path, newest activity first.
function hookGroups(items) {
  const map = new Map();
  for (const h of items) {
    if (!map.has(h.path)) map.set(h.path, []);
    map.get(h.path).push(h);
  }
  return [...map.entries()].map(([path, hooks]) => ({ path, hooks }));
}

function mailSrcdoc(m) {

    <dl class="meta">
      ${meta.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}
      <dt>Received</dt><dd>${new Date(m.time).toLocaleString()} <span class="sub">· ${ago(m.time)} · <code>${esc(m.id)}</code></span></dd>
    </dl>
    ${codesCard(m.codes)}
    ${linksCard(m.id, m.links)}
    ${attCard}
    <div>${vtabs(m.id, views, view, widthSeg)}</div>
    ${body}`;
}

// ---------- detail: hook ----------

function curlFor(h) {
  const skip = new Set(['content-length', 'connection', 'accept-encoding', 'host']);
  let c = `curl -X ${h.method} '${shq(CFG.hookURL + h.path + (h.query ? '?' + h.query : ''))}'`;
  for (const [k, vs] of Object.entries(h.headers || {})) {
    if (skip.has(k.toLowerCase())) continue;
    for (const v of vs || []) c += ` \\\n  -H '${shq(k + ': ' + v)}'`;
  }
  if (h.body) c += ` \\\n  --data-raw '${shq(h.body)}'`;
  return c;
}

function renderHookDetail(h) {
  const method = esc((h.method || '').toUpperCase());
  const ct = ((h.headers || {})['Content-Type'] || [])[0] || '';
  const body = h.body || '';
  const json = body.trim() ? parseJSON(body) : { ok: false };
  const form = !json.ok && body ? parseForm(body) : null;
  const query = h.query ? [...new URLSearchParams(h.query)] : [];
  const headerRows = Object.entries(h.headers || {}).sort(([a], [b]) => a.localeCompare(b)).map(([k, v]) => [k, (v || []).join(', ')]);

  const views = [['body', json.ok ? 'Body · JSON' : form ? 'Body · Form' : 'Body']];
  if (json.ok || form) views.push(['raw', 'Raw body']);
  if (query.length) views.push(['query', `Query (${query.length})`]);
  views.push(['headers', `Headers (${headerRows.length})`]);
  let view = state.view[h.id];
  if (!views.some(v => v[0] === view)) view = views[0][0];

  let content;
  if (view === 'body') {
    if (!body) content = '<div class="pre">(empty body)</div>';
    else if (json.ok) content = `<div class="pre">${hlJSON(json.v)}</div>`;
    else if (form) content = kvTable(form);
    else content = `<div class="pre">${esc(body)}</div>`;
  } else if (view === 'raw') content = `<div class="pre">${esc(body)}</div>`;
  else if (view === 'query') content = kvTable(query);
  else content = kvTable(headerRows);

  const sms = h.sms ? `<div class="card"><div class="card-h">Message<span class="grow"></span>
      <button class="btn-sm" data-act="copy" data-v="${esc(h.sms.text)}">Copy text</button></div>
    <div class="sms">
      ${h.sms.to || h.sms.from ? `<div class="sms-who">${h.sms.to ? `<span>To <b>${esc(h.sms.to)}</b></span>` : ''}${h.sms.from ? `<span>From <b>${esc(h.sms.from)}</b></span>` : ''}</div>` : ''}
      <div class="bubble">${richText(h.sms.text, h.codes)}</div>
    </div></div>` : '';

  const st = h.status || 200;
  return `
    <div class="d-head">
      <div class="d-title"><span class="method ${method}">${method}</span> <span class="path">${esc(h.path)}</span></div>
      <div class="d-actions">
        <button class="btn-sm" data-act="curl" data-id="${esc(h.id)}" title="Copy a curl command that replays this request to mailhook">Copy as curl</button>
        <button class="btn-sm btn-danger" data-act="del" data-id="${esc(h.id)}">delete</button>
      </div>
    </div>
    <dl class="meta">
      <dt>Received</dt><dd>${new Date(h.time).toLocaleString()} <span class="sub">· ${ago(h.time)} · <code>${esc(h.id)}</code></span></dd>
      <dt>From</dt><dd>${esc(h.remote || '')}</dd>
      ${ct ? `<dt>Type</dt><dd>${esc(ct)} <span class="sub">· ${size(body.length)}</span></dd>` : ''}
      <dt>Answered</dt><dd><span class="chip ${st >= 400 ? 'err' : st !== 200 ? 'warn' : ''}">${st}</span> ${h.rule ? `by rule <a href="#rule/${esc(h.rule)}" data-act="goto-rule" data-id="${esc(h.rule)}"><code>${esc(h.rule)}</code></a>` : '<span class="sub">default response</span>'}
        <button class="btn-sm" data-act="mock" data-m="${method}" data-v="${esc(h.path)}" style="margin-left:6px">${ruleFor(h.method, h.path) ? 'Edit response' : 'Set response'} for ${method} ${esc(h.path)}</button></dd>
    </dl>
    ${codesCard(h.codes)}
    ${sms}
    ${linksCard(h.id, h.links)}
    <div>${vtabs(h.id, views, view)}</div>
    ${content}`;
}

// ---------- detail: rule ----------

function renderRuleDetail(r) {
  const method = (r.method && r.method !== '*') ? esc(r.method.toUpperCase()) : 'ANY';
  const headerRows = Object.entries(r.headers || {});
  const json = r.body ? parseJSON(r.body) : { ok: false };
  const hits = state.data.hook.filter(h => h.rule === r.id).length;
  return `
    <div class="d-head">
      <div class="d-title"><span class="method ${method}">${method}</span> <span class="path">${esc(r.path || '*')}</span></div>
      <div class="d-actions">
        <button class="btn-sm" data-act="edit-rule" data-id="${esc(r.id)}">edit</button>
        <button class="btn-sm btn-danger" data-act="del" data-id="${esc(r.id)}">delete</button>
      </div>
    </div>
    <dl class="meta">
      <dt>Status</dt><dd>${r.status || 200}</dd>
      <dt>Delay</dt><dd>${r.delay_ms || 0} ms</dd>
      <dt>Matched</dt><dd>${hits} captured request${hits === 1 ? '' : 's'}</dd>
      <dt>Created</dt><dd>${new Date(r.created).toLocaleString()} <span class="sub">· <code>${esc(r.id)}</code></span></dd>
    </dl>
    <div class="card"><div class="card-h">Response headers</div>${headerRows.length ? `<table class="kv">${headerRows.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="v">${esc(v)}</td></tr>`).join('')}</table>` : '<div class="card-b sub">(none)</div>'}</div>
    <div class="card"><div class="card-h">Response body</div><div class="card-b"><div class="pre">${r.body ? (json.ok ? hlJSON(json.v) : esc(r.body)) : '(empty)'}</div></div></div>`;
}

function renderDetail() {
  const panel = $('detail-panel');
  const item = current();
  if (!item) {
    if (state.sel[state.tab]) state.sel[state.tab] = null;
    panel.innerHTML = `<div class="detail-empty">${state.data[state.tab].length ? 'Select an item to see it here.' : ''}</div>`;
    return;
  }
  const html = state.tab === 'mail' ? renderMailDetail(item) : state.tab === 'hook' ? renderHookDetail(item) : renderRuleDetail(item);
  panel.innerHTML = `<div class="detail-inner">${html}</div>`;
  const f = $('mail-frame');
  if (f) setupFrame(f);
}

function render() {
  const isRule = state.tab === 'rule';
  $('add-rule').hidden = !isRule;
  KINDS.forEach(k => $('tab-' + k).classList.toggle('active', k === state.tab));
  renderList();
  renderDetail();
  renderCounts();
}

let renderQueued = false;
function scheduleRender(listOnly) {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    renderList();
    renderCounts();
    // Only rebuild the detail if its item disappeared (keeps iframe + scroll).
    const id = state.sel[state.tab];
    if (!listOnly || (id && !current())) renderDetail();
  });
}

// ---------- selection & navigation ----------

function select(id, opts = {}) {
  state.sel[state.tab] = id;
  if (id) state.unread.delete(id);
  history.replaceState(null, '', id ? `#${state.tab}/${encodeURIComponent(id)}` : `#${state.tab}`);
  renderList();
  renderDetail();
  renderCounts();
  $('detail-panel').scrollTop = 0;
  if (opts.scroll !== false) {
    const el = document.querySelector(`.row[data-id="${CSS.escape(id || '')}"]`);
    if (el) el.scrollIntoView({ block: 'nearest' });
  }
}

function switchTab(k, id) {
  if (k !== state.tab) closeRuleForm();
  state.tab = k;
  if (id !== undefined) state.sel[k] = id;
  history.replaceState(null, '', state.sel[k] ? `#${k}/${encodeURIComponent(state.sel[k])}` : `#${k}`);
  if (state.sel[k]) state.unread.delete(state.sel[k]);
  render();
}

function move(delta) {
  const items = visible();
  if (!items.length) return;
  const i = items.findIndex(x => x.id === state.sel[state.tab]);
  const j = i < 0 ? 0 : Math.max(0, Math.min(items.length - 1, i + delta));
  select(items[j].id);
}

// ---------- actions ----------

async function deleteOne(kind, id) {
  if (kind === 'rule' && !confirm('Delete this rule?')) return;
  const res = await fetch(`/${kind}/${encodeURIComponent(id)}`, { method: 'DELETE' });
  if (!res.ok && res.status !== 404) return toast('Delete failed: ' + res.status);
  if (state.sel[kind] === id) {
    const items = visible(), i = items.findIndex(x => x.id === id);
    const next = items[i + 1] || items[i - 1];
    state.sel[kind] = next ? next.id : null;
  }
  applyEvent({ kind, op: 'delete', data: { id } });
  render();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (t) {
    const act = t.dataset.act, id = t.dataset.id;
    if (act === 'copy') { e.preventDefault(); e.stopPropagation(); return copy(t.dataset.v); }
    if (act === 'del') { e.stopPropagation(); return deleteOne(state.tab, id); }
    if (act === 'edit-rule') return openRuleForm(id);
    if (act === 'view') { state.view[id] = t.dataset.v; return renderDetail(); }
    if (act === 'width') { state.width = t.dataset.v; return renderDetail(); }
    if (act === 'params') { const k = t.dataset.k; state.openParams.has(k) ? state.openParams.delete(k) : state.openParams.add(k); return keepScroll(renderDetail); }
    if (act === 'all-links') { state.allLinks.has(id) ? state.allLinks.delete(id) : state.allLinks.add(id); return keepScroll(renderDetail); }
    if (act === 'curl') { const h = current(); return h && copy(curlFor(h)); }
    if (act === 'goto-rule') { e.preventDefault(); return switchTab('rule', id); }
    if (act === 'mock') { e.stopPropagation(); return openMock(t.dataset.m, t.dataset.v); }
    if (act === 'toggle-group') { const p = t.dataset.v; state.collapsed.has(p) ? state.collapsed.delete(p) : state.collapsed.add(p); return renderList(); }
    if (act === 'collapse-all') { state.data.hook.forEach(h => state.collapsed.add(h.path)); return renderList(); }
    if (act === 'expand-all') { state.collapsed.clear(); return renderList(); }
    if (act === 'group') { state.group = t.checked; lsSet('mh.group', state.group ? '1' : '0'); return renderList(); }
    return;
  }
  const row = e.target.closest('.row');
  if (row && row.closest('#list')) select(row.dataset.id, { scroll: false });
});

function keepScroll(fn) {
  const p = $('detail-panel'), top = p.scrollTop;
  fn();
  p.scrollTop = top;
}

document.addEventListener('keydown', e => {
  const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (e.key === 'Escape') {
    if (document.activeElement === $('search')) { $('search').value = ''; state.q = ''; renderList(); $('search').blur(); }
    else if ($('rule-form').classList.contains('open')) closeRuleForm();
    return;
  }
  if (inField || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); $('search').focus(); $('search').select(); }
  else if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); move(1); }
  else if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); move(-1); }
  else if (e.key === 'c') { const x = current(); if (x && x.codes && x.codes.length) copy(x.codes[0]); }
  else if (e.key === 'o') {
    const x = current(), l = x && (x.links || []).find(l => /^https?:/i.test(l.url));
    if (l) window.open(l.url, '_blank', 'noopener,noreferrer');
  }
});

$('search').addEventListener('input', e => { state.q = e.target.value; renderList(); });
$('tab-mail').onclick = () => switchTab('mail');
$('tab-hook').onclick = () => switchTab('hook');
$('tab-rule').onclick = () => switchTab('rule');
$('refresh').onclick = () => loadAll().then(render);
$('clear').onclick = async () => {
  const kind = state.tab;
  const label = kind === 'rule' ? 'rules' : kind + ' captures';
  if (!confirm(`Clear all ${state.data[kind].length} ${label}?`)) return;
  await fetch('/' + kind, { method: 'DELETE' });
  applyEvent({ kind, op: 'clear' });
  state.sel[kind] = null;
  render();
};
window.addEventListener('resize', () => {
  clearTimeout(window._rz);
  window._rz = setTimeout(() => { const f = $('mail-frame'); if (f) { f.style.height = '50px'; fitFrame(f); } }, 150);
});

// ---------- rule form ----------

// Edit the rule that answers method+path, or start one prefilled for it.
function openMock(method, path) {
  const r = ruleFor(method, path);
  if (r) return openRuleForm(r.id);
  openRuleForm(null, { method, path });
}

function openRuleForm(id, pre = {}) {
  editingRuleId = id || null;
  const r = id ? state.data.rule.find(x => x.id === id) : null;
  if (id && !r) return;
  $('rule-form-title').textContent = id ? `Edit rule (${r.method || '*'} ${r.path})` : pre.path ? `Response for ${pre.method} ${pre.path}` : 'New rule';
  $('rf-method').value = r ? (r.method || '*') : (pre.method || 'POST');
  $('rf-path').value = r ? r.path || '' : (pre.path || '');
  $('rf-status').value = r ? r.status || 200 : 200;
  $('rf-delay').value = r ? r.delay_ms || 0 : 0;
  $('rf-headers').value = r ? Object.entries(r.headers || {}).map(([k, v]) => `${k}: ${v}`).join('\n') : '';
  $('rf-body').value = r ? r.body || '' : '';
  $('rule-form').classList.add('open');
  setTimeout(() => (pre.path ? $('rf-status') : $('rf-path')).focus(), 30);
}
function closeRuleForm() {
  $('rule-form').classList.remove('open');
  editingRuleId = null;
}
$('add-rule').onclick = () => openRuleForm(null);
$('rf-cancel').onclick = closeRuleForm;
$('rf-save').onclick = async () => {
  const path = $('rf-path').value.trim();
  if (!path) { toast('Path is required. Use "*" for any.'); $('rf-path').focus(); return; }
  const headers = {};
  for (const line of $('rf-headers').value.split('\n')) {
    const idx = line.indexOf(':');
    if (idx < 0) continue;
    const k = line.slice(0, idx).trim(), v = line.slice(idx + 1).trim();
    if (k) headers[k] = v;
  }
  const rule = {
    method: $('rf-method').value, path,
    status: parseInt($('rf-status').value, 10) || 200,
    delay_ms: parseInt($('rf-delay').value, 10) || 0,
    headers, body: $('rf-body').value,
  };
  const res = await fetch(editingRuleId ? '/rule/' + encodeURIComponent(editingRuleId) : '/rule', {
    method: editingRuleId ? 'PUT' : 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(rule),
  });
  if (!res.ok) { toast('Save failed: ' + res.status + ' ' + (await res.text()).trim()); return; }
  const saved = await res.json();
  closeRuleForm();
  await loadKind('rule');
  if (state.tab === 'rule') state.sel.rule = saved.id;
  else toast(`Saved: ${saved.method || '*'} ${saved.path} → ${saved.status}`);
  render();
};

// ---------- data + live stream ----------

async function loadKind(k) {
  const res = await fetch('/' + k);
  state.data[k] = (await res.json()) || [];
}
async function loadAll() {
  try { await Promise.all(KINDS.map(loadKind)); }
  catch (e) { console.error('load failed', e); }
}

function applyEvent(ev) {
  const arr = state.data[ev.kind];
  if (!arr) return;
  if (!ev.op) {
    if (arr.some(x => x.id === ev.data.id)) return;
    arr.push(ev.data);
    if (arr.length > CFG.cap) arr.splice(0, arr.length - CFG.cap);
    if (state.sel[ev.kind] !== ev.data.id) state.unread.add(ev.data.id);
  } else if (ev.op === 'delete') {
    const i = arr.findIndex(x => x.id === ev.data.id);
    if (i >= 0) arr.splice(i, 1);
    state.unread.delete(ev.data.id);
  } else if (ev.op === 'clear') {
    arr.forEach(x => state.unread.delete(x.id));
    arr.length = 0;
  } else if (ev.op === 'change') {
    // Rules only affect the rule and hook views; keep an open mail untouched.
    loadKind(ev.kind).then(() => state.tab === 'mail' ? scheduleRender(true) : keepScroll(render));
  }
}

let liveCtrl = null, liveGen = 0;
async function startLive() {
  stopLive();
  const gen = ++liveGen;
  liveCtrl = new AbortController();
  let queue = null;
  try {
    const res = await fetch('/tail?kind=all&ops=1', { signal: liveCtrl.signal });
    $('livedot').classList.add('live');
    // Resync after (re)connecting; buffer events that race the reload.
    queue = [];
    loadAll().then(() => { const q = queue; queue = null; q.forEach(applyEvent); render(); });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl);
        buf = buf.slice(nl + 1);
        if (!line.trim()) continue;
        let ev;
        try { ev = JSON.parse(line); } catch { continue; }
        if (queue) { queue.push(ev); continue; }
        applyEvent(ev);
        scheduleRender(true);
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') console.warn('tail closed', e);
  } finally {
    if (gen === liveGen) {
      $('livedot').classList.remove('live');
      if ($('auto').checked) setTimeout(() => { if (gen === liveGen) startLive(); }, 1000);
    }
  }
}
function stopLive() {
  liveGen++;
  if (liveCtrl) { liveCtrl.abort(); liveCtrl = null; }
  $('livedot').classList.remove('live');
}
$('auto').onchange = e => e.target.checked ? startLive() : stopLive();

(async function init() {
  const m = location.hash.match(/^#(mail|hook|rule)(?:\/(.+))?$/);
  if (m) { state.tab = m[1]; if (m[2]) state.sel[m[1]] = decodeURIComponent(m[2]); }
  await loadAll();
  render();
  startLive();
})();
</script>
</body>
</html>
